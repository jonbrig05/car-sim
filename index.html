<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DE5 Configurator</title>
    <style>
      :root {
        --panel-bg: rgba(16, 16, 20, 0.92);
        --panel-fg: #e8e8ec;
        --muted: #9a9aa4;
        --accent: #d5001c;
        --line: rgba(255, 255, 255, 0.08);
        --panel-w: 350px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0c0c0e;
        color: var(--panel-fg);
      }
      #app { position: fixed; inset: 0; right: var(--panel-w); }
      #app canvas { display: block; }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 10px 14px;
        background: var(--panel-bg);
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }
      #hud .title { font-weight: 600; font-size: 14px; }
      #hud .sub { opacity: 0.65; }

      #presets {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 6px;
        z-index: 2;
      }
      #presets button {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-bg);
        color: var(--panel-fg);
        font-size: 12px;
        cursor: pointer;
      }
      #presets button:hover { border-color: var(--accent); }

      #panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: var(--panel-w);
        overflow-y: auto;
        background: var(--panel-bg);
        border-left: 1px solid var(--line);
        padding: 18px 16px 24px;
      }
      .panel-section { margin-bottom: 22px; }
      .panel-section h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .panel-section h3 { font-size: 12px; margin: 10px 0 6px; color: var(--panel-fg); }
      .hint { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }

      .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .swatch {
        position: relative;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
      }
      .swatch.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(213, 0, 28, 0.35); }
      .swatch-badge {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        padding: 0 4px;
        border-radius: 4px;
        background: #000;
        color: #cfcfd6;
        white-space: nowrap;
      }

      .pick-list { display: flex; flex-direction: column; gap: 4px; }
      .pick-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--panel-fg);
        font-size: 12px;
        cursor: pointer;
      }
      .pick-row:hover { border-color: rgba(255, 255, 255, 0.25); }
      .pick-row.selected { border-color: var(--accent); background: rgba(213, 0, 28, 0.08); }
      .pick-label { display: flex; flex-direction: column; gap: 2px; }
      .pick-sub { font-size: 10.5px; color: var(--muted); }
      .pick-price { font-variant-numeric: tabular-nums; color: var(--muted); flex-shrink: 0; }
      .flag-badge {
        align-self: flex-start;
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 176, 0, 0.15);
        color: #ffb000;
        border: 1px solid rgba(255, 176, 0, 0.35);
      }

      .build-sheet { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      .sheet-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .sheet-name { display: flex; align-items: center; gap: 6px; }
      .installed-badge {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(80, 200, 120, 0.15);
        color: #50c878;
      }
      .sheet-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .sheet-price { font-variant-numeric: tabular-nums; }
      .sheet-link { color: var(--accent); font-size: 11px; text-decoration: none; }
      .sheet-link:hover { text-decoration: underline; }
      .build-total { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
      .open-all {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .open-all:hover { filter: brightness(1.1); }
      .copy-link {
        margin-bottom: 8px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--panel-fg);
      }
      .copy-link:hover { border-color: var(--accent); filter: none; }

      .credits { font-size: 10.5px; color: var(--muted); line-height: 1.5; }
      .credits a { color: var(--muted); }

      @media (max-width: 760px) {
        :root { --panel-w: 300px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title">DE5 Integra Type S</div>
      <div class="sub" id="hud-status">loading&hellip;</div>
    </div>
    <div id="presets"></div>
    <aside id="panel"></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
